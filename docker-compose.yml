services:
  # Next.js Application (Production Build)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AUTH_SECRET: ${AUTH_SECRET}
        AUTH_URL: ${AUTH_URL}
        DATABASE_URL: ${DATABASE_URL}
        EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
        EMAIL_FROM: ${EMAIL_FROM}
        EMAIL_HOST: ${EMAIL_HOST}
        EMAIL_PASS: ${EMAIL_PASS}
        EMAIL_PORT: ${EMAIL_PORT}
        EMAIL_USER: ${EMAIL_USER}
    container_name: quanby-sign-app
    ports:
      - "3000:3000"
    environment:
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - AUTH_URL=${AUTH_URL}
      - DATABASE_URL=${DATABASE_URL}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - NODE_ENV=production
      - SKIP_ENV_VALIDATION=1

  # Development version (no Docker build, faster iteration)
  app-dev:
    image: node:20-alpine
    container_name: quanby-sign-dev
    working_dir: /app
    ports:
      - "3001:3000"
    environment:
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=http://localhost:3001
      - DATABASE_URL=${DATABASE_URL}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "corepack enable pnpm && pnpm install && pnpm db:generate && pnpm dev"
    profiles:
      - dev
