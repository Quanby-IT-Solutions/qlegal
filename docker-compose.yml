services:
  # Next.js Application (Production Build)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Auth
        AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
        AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
        AUTH_SECRET: ${AUTH_SECRET}
        AUTH_TRUST_HOST: ${AUTH_TRUST_HOST}
        AUTH_URL: ${AUTH_URL}
        # Database
        DATABASE_URL: ${DATABASE_URL}
        # DocOnChain
        DOCONCHAIN_API_URL: ${DOCONCHAIN_API_URL}
        DOCONCHAIN_APP_URL: ${DOCONCHAIN_APP_URL}
        DOCONCHAIN_CLIENT_KEY: ${DOCONCHAIN_CLIENT_KEY}
        DOCONCHAIN_CLIENT_SECRET: ${DOCONCHAIN_CLIENT_SECRET}
        DOCONCHAIN_EMAIL: ${DOCONCHAIN_EMAIL}
        DOCONCHAIN_ORGANIZATION_ID: ${DOCONCHAIN_ORGANIZATION_ID}
        # Email Configuration
        EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
        EMAIL_FROM: ${EMAIL_FROM}
        EMAIL_HOST: ${EMAIL_HOST}
        EMAIL_PASS: ${EMAIL_PASS}
        EMAIL_PORT: ${EMAIL_PORT}
        EMAIL_USER: ${EMAIL_USER}
        # Maps
        GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
        # Payment (HitPay)
        HITPAY_API_KEY: ${HITPAY_API_KEY}
        HITPAY_API_URL: ${HITPAY_API_URL}
        HITPAY_WEBHOOK_SALT: ${HITPAY_WEBHOOK_SALT}
        # KYC (HyperVerge)
        HYPERVERGE_API_URL: ${HYPERVERGE_API_URL}
        HYPERVERGE_APP_ID: ${HYPERVERGE_APP_ID}
        HYPERVERGE_APP_KEY: ${HYPERVERGE_APP_KEY}
        HYPERVERGE_DIRECT_LIVENESS_ENABLED: ${HYPERVERGE_DIRECT_LIVENESS_ENABLED}
        HYPERVERGE_WORKFLOW_ID: ${HYPERVERGE_WORKFLOW_ID}
        # Server Configuration
        NODE_ENV: production
        PORT: ${PORT}
        SEED_VALUE: ${SEED_VALUE}
        # Storage (Supabase)
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        # Video SDK (Meetings)
        NEXT_PUBLIC_VIDEO_SDK_API_KEY: ${NEXT_PUBLIC_VIDEO_SDK_API_KEY}
        VIDEO_SDK_API_KEY: ${VIDEO_SDK_API_KEY}
        VIDEO_SDK_SECRET: ${VIDEO_SDK_SECRET}
        # Public Site URL
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: quanby-sign-app
    ports:
      - "3000:3000"
    environment:
      # Auth
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - AUTH_URL=${AUTH_URL}
      # Database
      - DATABASE_URL=${DATABASE_URL}
      # DocOnChain
      - DOCONCHAIN_API_URL=${DOCONCHAIN_API_URL}
      - DOCONCHAIN_APP_URL=${DOCONCHAIN_APP_URL}
      - DOCONCHAIN_CLIENT_KEY=${DOCONCHAIN_CLIENT_KEY}
      - DOCONCHAIN_CLIENT_SECRET=${DOCONCHAIN_CLIENT_SECRET}
      - DOCONCHAIN_EMAIL=${DOCONCHAIN_EMAIL}
      - DOCONCHAIN_ORGANIZATION_ID=${DOCONCHAIN_ORGANIZATION_ID}
      # Email Configuration
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USER=${EMAIL_USER}
      # Maps
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      # Payment (HitPay)
      - HITPAY_API_KEY=${HITPAY_API_KEY}
      - HITPAY_API_URL=${HITPAY_API_URL}
      - HITPAY_WEBHOOK_SALT=${HITPAY_WEBHOOK_SALT}
      # KYC (HyperVerge)
      - HYPERVERGE_API_URL=${HYPERVERGE_API_URL}
      - HYPERVERGE_APP_ID=${HYPERVERGE_APP_ID}
      - HYPERVERGE_APP_KEY=${HYPERVERGE_APP_KEY}
      - HYPERVERGE_DIRECT_LIVENESS_ENABLED=${HYPERVERGE_DIRECT_LIVENESS_ENABLED}
      - HYPERVERGE_WORKFLOW_ID=${HYPERVERGE_WORKFLOW_ID}
      # Server Configuration
      - NODE_ENV=production
      - PORT=${PORT}
      - SEED_VALUE=${SEED_VALUE}
      # Storage (Supabase)
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # Video SDK (Meetings)
      - NEXT_PUBLIC_VIDEO_SDK_API_KEY=${NEXT_PUBLIC_VIDEO_SDK_API_KEY}
      - VIDEO_SDK_API_KEY=${VIDEO_SDK_API_KEY}
      - VIDEO_SDK_SECRET=${VIDEO_SDK_SECRET}
      # Public Site URL
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      # Build Configuration
      - SKIP_ENV_VALIDATION=1

  # Development version (no Docker build, faster iteration)
  app-dev:
    image: node:20-alpine
    container_name: quanby-sign-dev
    working_dir: /app
    ports:
      - "3001:3000"
    environment:
      # Auth
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - AUTH_URL=http://localhost:3001
      # Database
      - DATABASE_URL=${DATABASE_URL}
      # DocOnChain
      - DOCONCHAIN_API_URL=${DOCONCHAIN_API_URL}
      - DOCONCHAIN_APP_URL=${DOCONCHAIN_APP_URL}
      - DOCONCHAIN_CLIENT_KEY=${DOCONCHAIN_CLIENT_KEY}
      - DOCONCHAIN_CLIENT_SECRET=${DOCONCHAIN_CLIENT_SECRET}
      - DOCONCHAIN_EMAIL=${DOCONCHAIN_EMAIL}
      - DOCONCHAIN_ORGANIZATION_ID=${DOCONCHAIN_ORGANIZATION_ID}
      # Email Configuration
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USER=${EMAIL_USER}
      # Maps
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      # KYC (HyperVerge)
      - HYPERVERGE_API_URL=${HYPERVERGE_API_URL}
      - HYPERVERGE_APP_ID=${HYPERVERGE_APP_ID}
      - HYPERVERGE_APP_KEY=${HYPERVERGE_APP_KEY}
      - HYPERVERGE_DIRECT_LIVENESS_ENABLED=${HYPERVERGE_DIRECT_LIVENESS_ENABLED}
      - HYPERVERGE_WORKFLOW_ID=${HYPERVERGE_WORKFLOW_ID}
      # Server Configuration
      - NODE_ENV=development
      - PORT=${PORT}
      - SEED_VALUE=${SEED_VALUE}
      # Storage (Supabase)
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # Video SDK (Meetings)
      - NEXT_PUBLIC_VIDEO_SDK_API_KEY=${NEXT_PUBLIC_VIDEO_SDK_API_KEY}
      - VIDEO_SDK_API_KEY=${VIDEO_SDK_API_KEY}
      - VIDEO_SDK_SECRET=${VIDEO_SDK_SECRET}
      # Public Site URL
      - NEXT_PUBLIC_SITE_URL=http://localhost:3001
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "corepack enable pnpm && pnpm install && pnpm db:generate && pnpm dev"
    profiles:
      - dev
