name: Build and Deploy Node App to Cloud Run

on:
  push:
    branches:
      - production
  workflow_dispatch:

env:
  # Infra / Deploy config (unchanged)
  CONTAINER_PORT: ${{ vars.CONTAINER_PORT }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}

  # ==========================================================
  # QLEGAL ENVS (store values in GitHub Secrets unless you intentionally want Vars)
  # ==========================================================

  # Auth
  AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
  AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
  AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
  AUTH_TRUST_HOST: "true"
  AUTH_URL: ${{ vars.AUTH_URL }}

  # Database
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # DocOnChain (Enterprise API)
  DOCONCHAIN_API_URL: ${{ vars.DOCONCHAIN_API_URL }}
  DOCONCHAIN_APP_URL: ${{ vars.DOCONCHAIN_APP_URL }}
  DOCONCHAIN_CLIENT_KEY: ${{ secrets.DOCONCHAIN_CLIENT_KEY }}
  DOCONCHAIN_CLIENT_SECRET: ${{ secrets.DOCONCHAIN_CLIENT_SECRET }}
  DOCONCHAIN_EMAIL: ${{ secrets.DOCONCHAIN_EMAIL }}
  DOCONCHAIN_ORGANIZATION_ID: ${{ secrets.DOCONCHAIN_ORGANIZATION_ID }}
  DOCONCHAIN_ORG_INVITE_CODE: ${{ secrets.DOCONCHAIN_ORG_INVITE_CODE }}

  # Email Configuration
  EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
  EMAIL_FROM: ${{ vars.EMAIL_FROM }}
  EMAIL_HOST: ${{ vars.EMAIL_HOST }}
  EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
  EMAIL_PORT: ${{ vars.EMAIL_PORT }}
  EMAIL_USER: ${{ vars.EMAIL_USER }}

  # Maps
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

  # Payment (HitPay)
  HITPAY_API_KEY: ${{ secrets.HITPAY_API_KEY }}
  HITPAY_API_URL: ${{ vars.HITPAY_API_URL }}
  HITPAY_WEBHOOK_SALT: ${{ secrets.HITPAY_WEBHOOK_SALT }}

  # KYC (HyperVerge)
  HYPERVERGE_API_URL: ${{ vars.HYPERVERGE_API_URL }}
  HYPERVERGE_APP_ID: ${{ secrets.HYPERVERGE_APP_ID }}
  HYPERVERGE_APP_KEY: ${{ secrets.HYPERVERGE_APP_KEY }}
  HYPERVERGE_DIRECT_LIVENESS_ENABLED: ${{ vars.HYPERVERGE_DIRECT_LIVENESS_ENABLED }}
  HYPERVERGE_WORKFLOW_ID: ${{ secrets.HYPERVERGE_WORKFLOW_ID }}

  # Server Configuration
  NODE_ENV: "production"

  # Storage (Supabase)
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # Video SDK (Meetings)
  NEXT_PUBLIC_VIDEO_SDK_API_KEY: ${{ secrets.NEXT_PUBLIC_VIDEO_SDK_API_KEY }}
  VIDEO_SDK_API_KEY: ${{ secrets.VIDEO_SDK_API_KEY }}
  VIDEO_SDK_SECRET: ${{ secrets.VIDEO_SDK_SECRET }}

  # Supreme Court eNotarization API
  SUPREME_COURT_API_URL: ${{ vars.SUPREME_COURT_API_URL }}
  SUPREME_COURT_COGNITO_URL: ${{ vars.SUPREME_COURT_COGNITO_URL }}
  SUPREME_COURT_CLIENT_ID: ${{ secrets.SUPREME_COURT_CLIENT_ID }}
  SUPREME_COURT_USERNAME: ${{ secrets.SUPREME_COURT_USERNAME }}
  SUPREME_COURT_PASSWORD: ${{ secrets.SUPREME_COURT_PASSWORD }}

  # Public Site URL
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

jobs:
  deploy:
    environment: production
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          token_format: "access_token"
          credentials_json: "${{ secrets.GCP_CREDENTIALS_JSON }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${GAR_LOCATION}-docker.pkg.dev --quiet

      - name: Check and Create Artifact Registry Repository if not exists
        run: |
          if ! gcloud artifacts repositories describe $REPOSITORY \
            --location=$GAR_LOCATION \
            --project=$PROJECT_ID > /dev/null 2>&1; then
            echo "Artifact Registry $REPOSITORY not found. Creating..."
            gcloud artifacts repositories create $REPOSITORY \
              --repository-format=docker \
              --location=$GAR_LOCATION \
              --description="Docker repository for $REPOSITORY"
          else
            echo "Artifact Registry $REPOSITORY already exists."
          fi

      - name: Build and Push Container
        run: |
          docker build \
            --build-arg AUTH_GOOGLE_ID="${{ vars.AUTH_GOOGLE_ID }}" \
            --build-arg AUTH_GOOGLE_SECRET="${{ secrets.AUTH_GOOGLE_SECRET }}" \
            --build-arg AUTH_SECRET="${{ secrets.AUTH_SECRET }}" \
            --build-arg AUTH_TRUST_HOST="true" \
            --build-arg AUTH_URL="${{ vars.AUTH_URL }}" \
            --build-arg DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --build-arg DOCONCHAIN_API_URL="${{ vars.DOCONCHAIN_API_URL }}" \
            --build-arg DOCONCHAIN_APP_URL="${{ vars.DOCONCHAIN_APP_URL }}" \
            --build-arg DOCONCHAIN_CLIENT_KEY="${{ secrets.DOCONCHAIN_CLIENT_KEY }}" \
            --build-arg DOCONCHAIN_CLIENT_SECRET="${{ secrets.DOCONCHAIN_CLIENT_SECRET }}" \
            --build-arg DOCONCHAIN_EMAIL="${{ secrets.DOCONCHAIN_EMAIL }}" \
            --build-arg DOCONCHAIN_ORGANIZATION_ID="${{ secrets.DOCONCHAIN_ORGANIZATION_ID }}" \
            --build-arg DOCONCHAIN_ORG_INVITE_CODE="${{ secrets.DOCONCHAIN_ORG_INVITE_CODE }}" \
            --build-arg EMAIL_FROM_NAME="${{ vars.EMAIL_FROM_NAME }}" \
            --build-arg EMAIL_FROM="${{ vars.EMAIL_FROM }}" \
            --build-arg EMAIL_HOST="${{ vars.EMAIL_HOST }}" \
            --build-arg EMAIL_PASS="${{ secrets.EMAIL_PASS }}" \
            --build-arg EMAIL_PORT="${{ vars.EMAIL_PORT }}" \
            --build-arg EMAIL_USER="${{ vars.EMAIL_USER }}" \
            --build-arg GOOGLE_MAPS_API_KEY="${{ secrets.GOOGLE_MAPS_API_KEY }}" \
            --build-arg HITPAY_API_KEY="${{ secrets.HITPAY_API_KEY }}" \
            --build-arg HITPAY_API_URL="${{ vars.HITPAY_API_URL }}" \
            --build-arg HITPAY_WEBHOOK_SALT="${{ secrets.HITPAY_WEBHOOK_SALT }}" \
            --build-arg HYPERVERGE_API_URL="${{ vars.HYPERVERGE_API_URL }}" \
            --build-arg HYPERVERGE_APP_ID="${{ secrets.HYPERVERGE_APP_ID }}" \
            --build-arg HYPERVERGE_APP_KEY="${{ secrets.HYPERVERGE_APP_KEY }}" \
            --build-arg HYPERVERGE_DIRECT_LIVENESS_ENABLED="${{ vars.HYPERVERGE_DIRECT_LIVENESS_ENABLED }}" \
            --build-arg HYPERVERGE_WORKFLOW_ID="${{ secrets.HYPERVERGE_WORKFLOW_ID }}" \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_VIDEO_SDK_API_KEY="${{ secrets.NEXT_PUBLIC_VIDEO_SDK_API_KEY }}" \
            --build-arg NODE_ENV="production" \
            --build-arg SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            --build-arg VIDEO_SDK_API_KEY="${{ secrets.VIDEO_SDK_API_KEY }}" \
            --build-arg VIDEO_SDK_SECRET="${{ secrets.VIDEO_SDK_SECRET }}" \
            --build-arg SUPREME_COURT_API_URL="${{ vars.SUPREME_COURT_API_URL }}" \
            --build-arg SUPREME_COURT_COGNITO_URL="${{ vars.SUPREME_COURT_COGNITO_URL }}" \
            --build-arg SUPREME_COURT_CLIENT_ID="${{ secrets.SUPREME_COURT_CLIENT_ID }}" \
            --build-arg SUPREME_COURT_USERNAME="${{ secrets.SUPREME_COURT_USERNAME }}" \
            --build-arg SUPREME_COURT_PASSWORD="${{ secrets.SUPREME_COURT_PASSWORD }}" \
            -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}" .

          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"

      - name: Create Cloud Run service if not exists
        run: |
          if ! gcloud run services describe $SERVICE --region=$REGION --format="value(status.url)" 2>/dev/null; then
            echo "Creating Cloud Run service $SERVICE..."
            gcloud run deploy $SERVICE \
              --image="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}" \
              --region=$REGION \
              --platform=managed \
              --port=$CONTAINER_PORT \
              --allow-unauthenticated
          else
            echo "Cloud Run service $SERVICE already exists."
          fi

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          env_vars: |
            AUTH_GOOGLE_ID=${{ secrets.AUTH_GOOGLE_ID }}
            AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            AUTH_TRUST_HOST=true
            AUTH_URL=${{ vars.AUTH_URL }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DOCONCHAIN_API_URL=${{ vars.DOCONCHAIN_API_URL }}
            DOCONCHAIN_APP_URL=${{ vars.DOCONCHAIN_APP_URL }}
            DOCONCHAIN_CLIENT_KEY=${{ secrets.DOCONCHAIN_CLIENT_KEY }}
            DOCONCHAIN_CLIENT_SECRET=${{ secrets.DOCONCHAIN_CLIENT_SECRET }}
            DOCONCHAIN_EMAIL=${{ secrets.DOCONCHAIN_EMAIL }}
            DOCONCHAIN_ORGANIZATION_ID=${{ secrets.DOCONCHAIN_ORGANIZATION_ID }}
            DOCONCHAIN_ORG_INVITE_CODE=${{ secrets.DOCONCHAIN_ORG_INVITE_CODE }}
            EMAIL_FROM_NAME=${{ vars.EMAIL_FROM_NAME }}
            EMAIL_FROM=${{ vars.EMAIL_FROM }}
            EMAIL_HOST=${{ vars.EMAIL_HOST }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            EMAIL_PORT=${{ vars.EMAIL_PORT }}
            EMAIL_USER=${{ vars.EMAIL_USER }}
            GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
            HITPAY_API_KEY=${{ secrets.HITPAY_API_KEY }}
            HITPAY_API_URL=${{ vars.HITPAY_API_URL }}
            HITPAY_WEBHOOK_SALT=${{ secrets.HITPAY_WEBHOOK_SALT }}
            HYPERVERGE_API_URL=${{ vars.HYPERVERGE_API_URL }}
            HYPERVERGE_APP_ID=${{ secrets.HYPERVERGE_APP_ID }}
            HYPERVERGE_APP_KEY=${{ secrets.HYPERVERGE_APP_KEY }}
            HYPERVERGE_DIRECT_LIVENESS_ENABLED=${{ vars.HYPERVERGE_DIRECT_LIVENESS_ENABLED }}
            HYPERVERGE_WORKFLOW_ID=${{ secrets.HYPERVERGE_WORKFLOW_ID }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_VIDEO_SDK_API_KEY=${{ secrets.NEXT_PUBLIC_VIDEO_SDK_API_KEY }}
            NODE_ENV=production
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            VIDEO_SDK_API_KEY=${{ secrets.VIDEO_SDK_API_KEY }}
            VIDEO_SDK_SECRET=${{ secrets.VIDEO_SDK_SECRET }}
            SUPREME_COURT_API_URL=${{ vars.SUPREME_COURT_API_URL }}
            SUPREME_COURT_COGNITO_URL=${{ vars.SUPREME_COURT_COGNITO_URL }}
            SUPREME_COURT_CLIENT_ID=${{ secrets.SUPREME_COURT_CLIENT_ID }}
            SUPREME_COURT_USERNAME=${{ secrets.SUPREME_COURT_USERNAME }}
            SUPREME_COURT_PASSWORD=${{ secrets.SUPREME_COURT_PASSWORD }}
            SKIP_ENV_VALIDATION=1
          flags: >
            --min-instances=0
            --max-instances=50
            --memory=2Gi
            --cpu=1

      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}
